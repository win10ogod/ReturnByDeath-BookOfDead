name: Build and release riderpack integration

on:
  push:
    branches: [main]
    tags: ['riderpack-v*']
    paths:
      - 'riderpack-integration/**'
      - 'tools/riderpack_*.py'
      - '.github/workflows/riderpack-release.yml'
  pull_request:
    paths:
      - 'riderpack-integration/**'
      - 'tools/riderpack_*.py'
      - '.github/workflows/riderpack-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Check release version
        run: python tools/riderpack_artifacts.py --check-version
      - name: Download and verify locked dependencies
        run: python tools/riderpack_dependencies.py
      - name: Compile and run combat return tests
        working-directory: riderpack-integration
        run: bash gradlew --no-daemon build
      - name: Package integration and public sources
        run: python tools/riderpack_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riderpack-release
          path: dist/riderpack/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/riderpack-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: riderpack-release
          path: release-assets
      - name: Publish integration update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file riderpack-integration/release-notes.txt --latest=false
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --latest=false \
              --title "騎士輪迴生存：相容模組 ${GITHUB_REF_NAME#riderpack-v}" \
              --notes-file riderpack-integration/release-notes.txt
          fi
